name: alice_example
description: Demonstrates how to use the Alice plugin.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  dio: ^5.1.1
  share_plus: ^11.0.0
  rxdart: ^0.27.1

dev_dependencies:
  build_runner: ^2.0.6
  chopper_generator: 7.0.4
  flutter_alice:
    path: ../
flutter:
  uses-material-design: true
  assets:
    - assets/
